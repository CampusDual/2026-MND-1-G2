openapi: 3.0.3
info:
  title: Skeleton Fullstack API (Copilot)
  version: 1.0.0
  description: >
    Especificacion OpenAPI mantenida manualmente para el dominio actual de gestion
    de usuarios.
servers:
  - url: http://localhost:8080
security:
  - basicAuth: []
tags:
  - name: Users
    description: Operaciones de gestion de usuarios.
paths:
  /api/users:
    get:
      tags: [Users]
      summary: Lista todos los usuarios
      operationId: listUsers
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Users]
      summary: Crea un usuario
      operationId: createUser
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpsertRequestDto'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: Identificador numerico del usuario.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Users]
      summary: Obtiene un usuario por id
      operationId: getUserById
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Users]
      summary: Actualiza un usuario existente
      operationId: updateUser
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpsertRequestDto'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Users]
      summary: Elimina un usuario
      operationId: deleteUser
      security:
        - basicAuth: []
      responses:
        '204':
          description: Usuario eliminado correctamente
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/categories:
    get:
      tags: [Requests]
      summary: Consulta las categorías activas del catálogo
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum: [INCIDENT, SERVICE]
      responses:
        '200':
          description: Categorías del catálogo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestCategoryDto'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/categories/{categoryId}/subcategories:
    get:
      tags: [Requests]
      summary: Consulta las subcategorías de una categoría
      parameters:
        - in: path
          name: categoryId
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Subcategorías activas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestSubcategoryDto'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/requests:
    get:
      tags: [Requests]
      summary: Lista las solicitudes del camarote ficticio
      responses:
        '200':
          description: Solicitudes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceRequestDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Requests]
      summary: Crea una incidencia o solicitud
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceRequestCreateDto' }
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/requests/{id}:
    get:
      tags: [Requests]
      summary: Consulta el detalle de una solicitud
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Detalle de solicitud
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/worker-requests/unassigned:
    get:
      tags: [Workers]
      summary: Lista solicitudes pendientes sin asignar por departamento
      parameters:
        - in: query
          name: department
          required: true
          schema:
            type: string
            enum: [HOUSEKEEPING, MANTENIMIENTO]
      responses:
        '200':
          description: Solicitudes pendientes sin asignar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkerRequestDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/worker-requests/assigned:
    get:
      tags: [Workers]
      summary: Lista las solicitudes asignadas al trabajador autenticado
      parameters:
        - in: query
          name: department
          required: true
          schema: { type: string, enum: [HOUSEKEEPING, MANTENIMIENTO] }
      responses:
        '200':
          description: Solicitudes asignadas o en curso
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkerRequestDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/worker-requests/resolved:
    get:
      tags: [Workers]
      summary: Lista las solicitudes finalizadas del trabajador autenticado
      parameters:
        - in: query
          name: department
          required: true
          schema: { type: string, enum: [HOUSEKEEPING, MANTENIMIENTO] }
      responses:
        '200':
          description: Solicitudes finalizadas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkerRequestDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/worker-requests/{id}/assign:
    post:
      tags: [Workers]
      summary: Asigna una solicitud al trabajador autenticado
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: department
          required: true
          schema: { type: string, enum: [HOUSEKEEPING, MANTENIMIENTO] }
      responses:
        '200':
          description: Solicitud asignada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerRequestDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Solicitud ya asignada o stock insuficiente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/worker-requests/{id}/start:
    post:
      tags: [Workers]
      summary: Inicia una solicitud asignada
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: department
          required: true
          schema: { type: string, enum: [HOUSEKEEPING, MANTENIMIENTO] }
      responses:
        '200':
          description: Solicitud en curso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerRequestDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/worker-requests/{id}/resolve:
    post:
      tags: [Workers]
      summary: Finaliza una solicitud en curso
      description: Al resolver una solicitud vinculada a un consumible, descuenta su cantidad una sola vez; los reutilizables se gestionan mediante movimientos explícitos.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: department
          required: true
          schema: { type: string, enum: [HOUSEKEEPING, MANTENIMIENTO] }
      responses:
        '200':
          description: Solicitud finalizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerRequestDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/stock:
    get:
      tags: [Stock]
      summary: Consulta el inventario activo y sus contadores por estado
      responses:
        '200':
          description: Inventario y resumen calculados desde las cantidades persistidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockSummaryDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Stock]
      summary: Crea un producto y registra su inventario inicial
      operationId: createStockProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockCreateRequestDto' }
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockProductDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/stock/{productId}:
    parameters:
      - in: path
        name: productId
        required: true
        description: Identificador del producto.
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags: [Stock]
      summary: Actualiza los datos descriptivos y el mínimo de un producto
      operationId: updateStockProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockUpdateRequestDto' }
      responses:
        '200':
          description: Producto actualizado sin alterar las cantidades
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockProductDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/stock/{productId}/movements:
    parameters:
      - in: path
        name: productId
        required: true
        description: Identificador del producto.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Stock]
      summary: Consulta el historial de movimientos de un producto
      operationId: listStockMovements
      responses:
        '200':
          description: Movimientos ordenados desde el más reciente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockMovementDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Stock]
      summary: Registra una entrada, movimiento de lavandería o desecho
      operationId: createStockMovement
      description: Puede asociarse a una tarea de Housekeeping en curso para registrar al trabajador responsable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockMovementCreateRequestDto' }
      responses:
        '201':
          description: Movimiento registrado de forma transaccional e idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovementDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  responses:
    BadRequest:
      description: Solicitud invalida por datos o formato incorrecto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Credenciales ausentes o invalidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: El usuario autenticado no dispone de permisos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso solicitado no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto de negocio (estado incompatible o recurso duplicado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Error de validacion semantica en la solicitud.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Error interno no controlado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    StockProductDto:
      type: object
      required:
        - productId
        - name
        - stockType
        - uds
        - warehouseUnits
        - laundryUnits
        - minimumStock
        - status
        - active
      properties:
        productId: { type: integer, format: int64, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 160 }
        uds: { type: integer, minimum: 0 }
        description: { type: string, maxLength: 255, nullable: true }
        stockType: { type: string, enum: [CONSUMABLE, REUSABLE] }
        warehouseUnits: { type: integer, minimum: 0 }
        laundryUnits: { type: integer, minimum: 0 }
        minimumStock: { type: integer, minimum: 0 }
        status: { type: string, enum: [CORRECT, REORDER_SOON, REORDER] }
        subcategoryId: { type: integer, format: int64, minimum: 1, nullable: true }
        subcategoryName: { type: string, nullable: true }
        active: { type: boolean }
    StockSummaryDto:
      type: object
      required:
        - products
        - differentProducts
        - correctProducts
        - reorderSoonProducts
        - reorderProducts
      properties:
        products:
          type: array
          items: { $ref: '#/components/schemas/StockProductDto' }
        differentProducts: { type: integer, minimum: 0 }
        correctProducts: { type: integer, minimum: 0 }
        reorderSoonProducts: { type: integer, minimum: 0 }
        reorderProducts: { type: integer, minimum: 0 }
    StockCreateRequestDto:
      type: object
      required: [name, stockType, initialUnits, minimumStock, idempotencyKey]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        stockType: { type: string, enum: [CONSUMABLE, REUSABLE] }
        initialUnits: { type: integer, minimum: 0 }
        minimumStock: { type: integer, minimum: 0 }
        description: { type: string, maxLength: 255, nullable: true }
        subcategoryId: { type: integer, format: int64, minimum: 1, nullable: true }
        idempotencyKey: { type: string, minLength: 1, maxLength: 160 }
    StockUpdateRequestDto:
      type: object
      required: [name, minimumStock]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 255, nullable: true }
        minimumStock: { type: integer, minimum: 0 }
    StockMovementCreateRequestDto:
      type: object
      required: [movementType, quantity, idempotencyKey]
      properties:
        movementType: { type: string, enum: [STOCK_ENTRY, TO_LAUNDRY, FROM_LAUNDRY, DISPOSAL] }
        quantity: { type: integer, minimum: 1 }
        sourceState: { type: string, enum: [WAREHOUSE, LAUNDRY], nullable: true }
        reason: { type: string, minLength: 1, maxLength: 255, nullable: true }
        idempotencyKey: { type: string, minLength: 1, maxLength: 160 }
        serviceRequestId: { type: integer, format: int64, minimum: 1, nullable: true }
    StockMovementDto:
      type: object
      required:
        - movementId
        - productId
        - productName
        - movementType
        - quantity
        - createdAt
        - actorUsername
        - previousWarehouse
        - previousLaundry
        - previousTotal
        - nextWarehouse
        - nextLaundry
        - nextTotal
      properties:
        movementId: { type: integer, format: int64, minimum: 1 }
        productId: { type: integer, format: int64, minimum: 1 }
        productName: { type: string }
        movementType: { type: string, enum: [STOCK_ENTRY, CONSUMPTION, TO_LAUNDRY, FROM_LAUNDRY, DISPOSAL] }
        quantity: { type: integer, minimum: 1 }
        sourceState: { type: string, enum: [WAREHOUSE, LAUNDRY], nullable: true }
        reason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        actorUsername: { type: string, minLength: 1, maxLength: 120 }
        workerId: { type: integer, format: int64, minimum: 1, nullable: true }
        serviceRequestId: { type: integer, format: int64, minimum: 1, nullable: true }
        previousWarehouse: { type: integer, minimum: 0 }
        previousLaundry: { type: integer, minimum: 0 }
        previousTotal: { type: integer, minimum: 0 }
        nextWarehouse: { type: integer, minimum: 0 }
        nextLaundry: { type: integer, minimum: 0 }
        nextTotal: { type: integer, minimum: 0 }
    WorkerRequestDto:
      type: object
      required: [serviceRequestId, cabinNumber, itemName, status]
      properties:
        serviceRequestId: { type: integer, format: int64, minimum: 1 }
        cabinNumber: { type: integer, minimum: 1 }
        itemName: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1, nullable: true }
        status: { type: string, enum: [PENDING, ASSIGNED, IN_PROGRESS, RESOLVED] }
    UserDto:
      type: object
      required:
        - id
        - username
        - enabled
        - roles
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        username:
          type: string
          minLength: 1
          maxLength: 80
          example: admin
        enabled:
          type: boolean
          example: true
        roles:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 80
            example: ROLE_ADMIN
    UserUpsertRequestDto:
      type: object
      required:
        - username
        - password
        - enabled
        - roles
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 80
          description: Nombre de usuario. Se normaliza internamente a minusculas.
          example: manager
        password:
          type: string
          minLength: 8
          maxLength: 120
          format: password
          example: securePass123
        enabled:
          type: boolean
          example: true
        roles:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 80
            description: Rol del usuario; si no incluye prefijo ROLE_ se normaliza.
            example: ADMIN
    ValidationErrorItem:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: username
        message:
          type: string
          example: El nombre de usuario es obligatorio
    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-09-25T08:20:58Z'
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: El id debe ser mayor que cero
        errors:
          type: array
          description: Detalle opcional de errores de validacion por campo.
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
    RequestSubcategoryDto:
      type: object
      required: [subcategoryId, categoryId, name, description, icon, active]
      properties:
        subcategoryId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        active: { type: boolean }
    RequestCategoryDto:
      type: object
      required: [categoryId, name, type, description, icon, active, subcategories]
      properties:
        categoryId: { type: integer, format: int64 }
        name: { type: string }
        type: { type: string, enum: [INCIDENT, SERVICE] }
        description: { type: string }
        icon: { type: string }
        active: { type: boolean }
        subcategories:
          type: array
          items: { $ref: '#/components/schemas/RequestSubcategoryDto' }
    ServiceRequestCreateDto:
      type: object
      required: [categoryId, subcategoryId]
      properties:
        categoryId: { type: integer, format: int64, minimum: 1 }
        subcategoryId: { type: integer, format: int64, minimum: 1 }
        quantity: { type: integer, minimum: 1 }
        preferredDelivery: { type: string, enum: [ASAP, NEXT_SHIFT] }
    ServiceRequestDto:
      type: object
      properties:
        serviceRequestId: { type: integer, format: int64 }
        cabinNumber: { type: integer }
        category: { $ref: '#/components/schemas/RequestCategoryDto' }
        subcategory: { $ref: '#/components/schemas/RequestSubcategoryDto' }
        quantity: { type: integer, minimum: 1, nullable: true }
        preferredDelivery: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, ASSIGNED, IN_PROGRESS, RESOLVED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        statusHistory:
          type: array
          items: { $ref: '#/components/schemas/RequestStatusHistoryDto' }
    RequestStatusHistoryDto:
      type: object
      properties:
        previousStatus: { type: string, nullable: true }
        newStatus: { type: string }
        changedAt: { type: string, format: date-time }
